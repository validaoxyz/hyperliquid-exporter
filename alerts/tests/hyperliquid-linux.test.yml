rule_files:
  - ../hyperliquid-linux.rules.yml

evaluation_interval: 1m

tests:
  - name: HyperliquidNodeProcessDown firing
    interval: 1m
    input_series:
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="node-a",process="hl-node"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="node-a",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="node-a",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="node-a",source="process"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: HyperliquidNodeProcessDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperliquid-exporter
              instance: node-a
              process: hl-node
            exp_annotations:
              summary: "The hl-node process is not present"
              description: "Complete valid procfs scans have not found the hl-node process for 2 minutes."

  - name: HyperliquidNodeProcessDown nonfiring
    interval: 1m
    input_series:
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="healthy",process="hl-node"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="healthy",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="healthy",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="healthy",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="disabled",process="hl-node"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="disabled",source="process"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="disabled",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="disabled",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="read-failed",process="hl-node"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="read-failed",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="read-failed",source="process"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="read-failed",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="schema-failed",process="hl-node"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="schema-failed",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="schema-failed",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="schema-failed",source="process"}'
        values: '0 0 0 0'
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="short",process="hl-node"}'
        values: '1 1 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="short",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="short",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="short",source="process"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: HyperliquidNodeProcessDown
        exp_alerts: []

  - name: HyperliquidVisorProcessDown firing
    interval: 1m
    input_series:
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="node-a",process="hl-visor"}'
        values: '0 0 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="node-a",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="node-a",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="node-a",source="process"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: HyperliquidVisorProcessDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: hyperliquid-exporter
              instance: node-a
              process: hl-visor
            exp_annotations:
              summary: "The hl-visor process is not present"
              description: "Complete valid procfs scans have not found the hl-visor process for 2 minutes."

  - name: HyperliquidVisorProcessDown nonfiring
    interval: 1m
    input_series:
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="healthy",process="hl-visor"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="healthy",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="healthy",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="healthy",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_node_process_up{job="hyperliquid-exporter",instance="short",process="hl-visor"}'
        values: '1 1 0 0'
      - series: 'hl_exporter_source_enabled{job="hyperliquid-exporter",instance="short",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_read_ok{job="hyperliquid-exporter",instance="short",source="process"}'
        values: '1 1 1 1'
      - series: 'hl_exporter_source_schema_ok{job="hyperliquid-exporter",instance="short",source="process"}'
        values: '1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: HyperliquidVisorProcessDown
        exp_alerts: []
