groups:
  - name: hyperliquid-extended
    rules:
      - alert: HyperliquidTmpMaterialStale
        expr: |
          (hl_node_tmp_material_stale_bytes > 0)
            and on(job, instance)
          (hl_node_tmp_scan_up == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Retained Hyperliquid tmp material is stale on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has reported {{ $value }} non-receipt tmp bytes older than 24 hours for 15 minutes after a complete scan."
